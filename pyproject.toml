[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loafer"
version = "0.4.0"
description = "A local sloth that reads your chats while you sleep"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["offline", "local-llm", "ollama", "summarizer", "open-source-ai"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
loafer = "loafer.cli:main"

[tool.setuptools]
packages = ["loafer"]
